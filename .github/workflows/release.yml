name: Release packages

# كل دفع أو طلب دمج يمس الإضافة أو القالب:
#   1. فحص صياغة PHP وJS وتطابق أرقام الإصدار (.github/scripts/check.sh).
#   2. بناء retrovault-core.zip و retrovault-theme.zip (build.sh).
#   3. تثبيتهما على ووردبريس حقيقي بـ PHP 7.4 و8.4 وفتح صفحات الموقع؛ أي خطأ PHP يُفشل الفحص (smoke.sh).
# على الفرع الافتراضي، وبعد نجاح كل ذلك: يُنشأ Release لرقم الإصدار إن لم يكن منشوراً، بملاحظات
# من CHANGELOG.md، فيظهر التحديث في مواقع ووردبريس تلقائياً (لوحة التحكم ← التحديثات).

on:
  push:
    paths:
      - 'retrovault/**'
      - 'retrovault-core/**'
      - '.github/workflows/release.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'retrovault/**'
      - 'retrovault-core/**'
      - '.github/workflows/release.yml'
      - '.github/scripts/**'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@v5

      - name: Check syntax and versions
        run: .github/scripts/check.sh

      - name: Build zip files
        run: .github/scripts/build.sh

      - name: Install interface browser
        if: matrix.php == '8.4'
        run: |
          npm install --prefix "$RUNNER_TEMP/rv-browser" --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/rv-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Smoke test on WordPress
        env:
          RV_UI_AUDIT: ${{ matrix.php == '8.4' && '1' || '0' }}
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/rv-browser/node_modules/playwright
        run: .github/scripts/smoke.sh ${{ matrix.php }}

      - name: Upload interface review
        if: always() && matrix.php == '8.4'
        uses: actions/upload-artifact@v4
        with:
          name: interface-review
          path: ui-review/
          retention-days: 14

  browser:
    name: Browser offline regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/rv-browser" --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/rv-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify service worker lifecycle and offline readiness in Chromium
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/rv-browser/node_modules/playwright" node .github/scripts/pwa.test.cjs

  release:
    name: Publish release
    needs: [test, browser]
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        run: .github/scripts/check.sh

      - name: Build zip files
        run: .github/scripts/build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::Release $tag already exists. Bump the version to publish a new one."
            exit 0
          fi
          .github/scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" dist/retrovault-core.zip dist/retrovault-theme.zip \
            --target "$GITHUB_SHA" --title "RetroVault $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
